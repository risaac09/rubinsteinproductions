<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source of truth for the Open Graph card. Render it with:

      node scripts/render-og-card.mjs

  which injects the EB Garamond webfont and writes public/og-card.png.
  Edit this file, never the PNG. The two drifting apart is what put a
  retired Brand A card on every RP social preview from June to September 2026.

  Coordinates are fitted to EB Garamond, the Brand B display face
  (src/styles/design-system.css). Georgia is the fallback and has wider
  metrics, so a Georgia rendering will not match this layout.

  Palette, by design token name: white #faf8f5, marrow #1a1412,
  ash #a89e93, blood #8b2e1c, bone #f2ece4.

  Keep double hyphens out of this comment. They are illegal in XML and
  make the file unparseable as an image, which silently breaks the render.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf8f5"/>

  <g font-family="EB Garamond, Georgia, serif" fill="#1a1412">

    <!-- Wordmark -->
    <text x="80" y="100" font-size="34" letter-spacing="0.5">Rubinstein</text>
    <text x="252" y="100" font-size="11" fill="#a89e93" letter-spacing="3">PRODUCTIONS</text>
    <circle cx="374" cy="96" r="3" fill="#8b2e1c"/>
    <line x1="80" y1="120" x2="380" y2="120" stroke="#a89e93" stroke-width="1" opacity="0.6"/>

    <!-- Headline -->
    <text x="80" y="320" font-size="168">Say</text>
    <text x="334" y="320" font-size="168" font-style="italic" fill="#8b2e1c">why.</text>

    <!-- Subtitle -->
    <text x="80" y="400" font-size="27" fill="#a89e93">Facilitation &amp; Film for mission-driven professionals.</text>

    <!-- Footer -->
    <line x1="80" y1="500" x2="1120" y2="500" stroke="#a89e93" stroke-width="1" opacity="0.4"/>
    <text x="80" y="530" font-size="19" fill="#a89e93" letter-spacing="1">rubinsteinproductions.com</text>

    <!-- RP monogram, shared stroke -->
    <rect x="1060" y="480" width="60" height="60" rx="6" fill="#1a1412"/>
    <rect x="1091.8" y="497" width="1.25" height="26" fill="#a89e93" opacity="0.5"/>
    <text x="1067.4" y="522" font-size="30" fill="#f2ece4">R</text>
    <text x="1096" y="522" font-size="30" fill="#8b2e1c">P</text>

  </g>
</svg>
